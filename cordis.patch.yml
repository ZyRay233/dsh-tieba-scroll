# ============================================================================
# dsh-tieba-scroll —— DSH bundle patch（插件**自带**的挂载声明）
# ============================================================================
# 这就是"标准 DSH 插件"的样子：包自己声明要往 profile 的配置树里插什么。
# 装上之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效，
# 不用再手改 profile 自己的 cordis.patch.yml：
#
#   dsh plugin --profile web add link:<你自己的插件目录>
#   （发布后：dsh plugin --profile web add dsh-tieba-scroll）
#
# 组成顺序：每个 bundle 的 patch 按 `dsh.profile.bundles` 顺序叠
#          → 再叠 profile 自己那一层的 cordis.patch.yml（只有那层是热重载）
#
# ⚠️ entry 的 id 必须等于 index.js 里 `export const name`（= 'tieba-scroll'），
#    否则桥不通：设置层认不出这个命名空间、写配置会报
#    "Plugin entry … has no volatile fields"。
# ============================================================================

- insert:
    - id: tieba-scroll
      name: dsh-tieba-scroll
      config:
        # 真正的用户配置在插件自己的 config.json 里（设置页可改），这里只放默认值
        enabled: true
